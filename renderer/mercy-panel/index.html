<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self'; font-src 'self'; img-src 'self' data:"
    />
    <title>Mercy</title>
    <link rel="stylesheet" href="panel.css" />
    <script type="module" src="panel.js"></script>
  </head>
  <body>
    <div id="card" class="card" data-state="idle">
      <header class="head">
        <button id="orb" class="orb" title="Talk" aria-label="Talk"><canvas></canvas></button>
        <span class="title">Mercy</span>
        <span id="label" class="state">Ready</span>
      </header>

      <section class="tiles" aria-label="Quick controls">
        <button id="tileWake" class="tile wide" data-on="false">
          <span class="tile-icon">
            <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="7.5" /><circle cx="12" cy="12" r="2.5" class="fill" /></svg>
          </span>
          <span class="tile-text"><b>Hey Mercy</b><small id="wakeSub">Off</small></span>
        </button>
        <button id="tileSpeak" class="tile wide" data-on="true">
          <span class="tile-icon">
            <svg viewBox="0 0 24 24"><path d="M4 10v4h4l5 4V6L8 10H4z" class="fill" /><path d="M16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12" /></svg>
          </span>
          <span class="tile-text"><b>Speak replies</b><small id="speakSub">On</small></span>
        </button>
        <button id="screen" class="tile round" title="Look at my screen" aria-label="Look at my screen">
          <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="12" rx="2" /><path d="M8 20h8M12 16v4" /></svg>
        </button>
        <button id="tileVoice" class="tile wide" data-on="false">
          <span class="tile-icon">
            <svg viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="11" rx="3" /><path d="M5 11a7 7 0 0 0 14 0M12 18v3" /></svg>
          </span>
          <span class="tile-text"><b>My voice</b><small id="voiceSub">Not set up</small></span>
        </button>
        <button id="settings" class="tile round" title="More" aria-label="More">
          <svg viewBox="0 0 24 24"><circle cx="6" cy="12" r="1.6" class="fill" /><circle cx="12" cy="12" r="1.6" class="fill" /><circle cx="18" cy="12" r="1.6" class="fill" /></svg>
        </button>
      </section>

      <div id="menu" class="popover" hidden>
        <label class="row"><input id="loginToggle" type="checkbox" /> Open at login</label>
        <label class="row">Brain
          <select id="brain" aria-label="Brain">
            <option value="deepseek">DeepSeek</option>
            <option value="chatgpt">ChatGPT</option>
          </select>
        </label>
        <label class="row" hidden>Model
          <select id="brainModel" aria-label="ChatGPT model"></select>
        </label>
        <label class="row">Speech recognition
          <select id="sttEngine" aria-label="Speech recognition">
            <option value="deepgram">Deepgram</option>
            <option value="apple">On this Mac</option>
            <option value="auto">Auto</option>
          </select>
        </label>
        <button id="permsBtn" class="row">Permissions…</button>
        <button id="apiKeys" class="row">API keys…</button>
        <button id="showLogs" class="row">Show logs</button>
        <button id="retrain" class="row">Re-train my voice</button>
        <button id="forget" class="row danger">Delete my voice</button>
        <button id="quit" class="row danger">Quit Mercy</button>
      </div>

      <main id="log" class="log"></main>

      <footer class="foot">
        <form id="ask" class="ask" autocomplete="off">
          <textarea id="input" rows="1" placeholder="Ask Mercy anything…" aria-label="Message Mercy"></textarea>
          <button id="send" class="send" type="submit" title="Send (Enter)" aria-label="Send">
            <svg viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6" /></svg>
          </button>
          <button id="talk" class="mic" type="button" title="Talk" aria-label="Talk">
            <svg viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="11" rx="3" /><path d="M5 11a7 7 0 0 0 14 0M12 18v3" /></svg>
          </button>
        </form>
        <div id="talkText" class="foot-hint">Enter to send · say “Hey Mercy”</div>
      </footer>
    </div>
  </body>
</html>
